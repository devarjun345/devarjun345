<svg xmlns="http://www.w3.org/2000/svg" width="420" height="500" viewBox="0 0 420 500" style="background:#0d1117">
<defs>
<linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:0.3"/>
<stop offset="100%" style="stop-color:#1c7ed6;stop-opacity:0.1"/>
</linearGradient>
</defs>
<style>
text { font-family: "Courier New", monospace; font-size: 10px; fill: #4ecdc4; }
.label { font-size: 14px; fill: #8b949e; }
</style>

<!-- Background glow -->
<rect x="20" y="20" width="380" height="460" rx="12" fill="url(#glow)" opacity="0">
<animate attributeName="opacity" from="0" to="1" begin="0s" dur="1s" fill="freeze"/>
</rect>

<!-- ASCII Art Lines with draw-in animation -->
<g opacity="0">
<animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.5s" fill="freeze"/>
<text x="40" y="60">          .,::;;;;::,.</text>
<text x="40" y="72">      .,::;;;;;;;;;;;;::,.</text>
<text x="40" y="84">    .;;;;;;;;;;;;;;;;;;;;;;;;.</text>
<text x="40" y="96">   ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;</text>
<text x="40" y="108">  ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;</text>
<text x="40" y="120"> ;;;;;;;;  ;;;;;;;;;;;;  ;;;;;;;;;</text>
<text x="40" y="132"> ;;;;;;;;    ;;;;;;;;    ;;;;;;;;;</text>
<text x="40" y="144"> ;;;;;;;;  ++  ;;;;  ++  ;;;;;;;;;</text>
<text x="40" y="156"> ;;;;;;;;  ++++    ++++  ;;;;;;;;;</text>
<text x="40" y="168"> ;;;;;;;;  ++++++++++++  ;;;;;;;;;</text>
<text x="40" y="180">  ;;;;;;;  ++++++++++++  ;;;;;;;;</text>
<text x="40" y="192">   ;;;;;;    ++++++++    ;;;;;;;</text>
<text x="40" y="204">    ;;;;;      ++++      ;;;;;;</text>
<text x="40" y="216">     ;;;;      ++++      ;;;;;</text>
<text x="40" y="228">      ;;;    ++++++++    ;;;;</text>
<text x="40" y="240">       ;;  ++++++++++++  ;;;</text>
<text x="40" y="252">        ;  ++++++++++++  ;;</text>
<text x="40" y="264">          ++++++++++++++++</text>
<text x="40" y="276">         ++++++++++++++++++</text>
<text x="40" y="288">        ++++++++++++++++++++</text>
<text x="40" y="300">       ++++++++++++++++++++++</text>
<text x="40" y="312">      ++++++++++++++++++++++++</text>
<text x="40" y="324">     ++++++++++++++++++++++++++</text>
<text x="40" y="336">    ++++++++++++++++++++++++++++</text>
</g>

<!-- Blinking cursor -->
<rect x="40" y="350" width="8" height="14" fill="#4ecdc4">
<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>

<!-- Upload hint -->
<text x="40" y="400" class="label">[ Upload your photo ]</text>
<text x="40" y="420" class="label" style="font-size:11px;">Run: python tools/clean_photo.py</text>
<text x="40" y="435" class="label" style="font-size:11px;">Then: python tools/render_portrait.py</text>

<!-- Animated border -->
<rect x="20" y="20" width="380" height="460" rx="12" fill="none" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="1680" stroke-dashoffset="1680">
<animate attributeName="stroke-dashoffset" from="1680" to="0" begin="0s" dur="2s" fill="freeze"/>
</rect>
</svg>