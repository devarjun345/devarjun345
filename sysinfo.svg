<svg xmlns="http://www.w3.org/2000/svg" width="500" height="280" viewBox="0 0 500 280" style="background:#0d1117">
<style>
text { font-family: "Courier New", monospace; font-size: 13px; }
.label { fill: #4ecdc4; font-weight: bold; }
.value { fill: #c9d1d9; }
.dim { fill: #8b949e; }
.header { fill: #0d1117; }
.header-bg { fill: #4ecdc4; }
</style>

<!-- Header bar -->
<rect class="header-bg" x="0" y="0" width="500" height="36" rx="6" ry="6"/>
<text x="20" y="24" class="header" style="font-weight:bold; font-size:14px">$ whoami --verbose</text>

<!-- Window dots -->
<circle cx="460" cy="18" r="6" fill="#ff5f56"/>
<circle cx="444" cy="18" r="6" fill="#ffbd2e"/>
<circle cx="428" cy="18" r="6" fill="#27c93f"/>

<!-- Content rows with fade-in -->
<g id="r0" opacity="0">
<animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="0.3s" dur="0.4s" fill="freeze"/>
<text x="20" y="70" class="label">name:</text>
<text x="140" y="70" class="value">devvvv</text>
</g>

<g id="r1" opacity="0">
<animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.4s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="0.5s" dur="0.4s" fill="freeze"/>
<text x="20" y="96" class="label">role:</text>
<text x="140" y="96" class="value">Full-Stack Dev (MERN) &amp; Python</text>
</g>

<g id="r2" opacity="0">
<animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.4s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="0.7s" dur="0.4s" fill="freeze"/>
<text x="20" y="122" class="label">focus:</text>
<text x="140" y="122" class="value">Generative AI · Cybersecurity</text>
</g>

<g id="r3" opacity="0">
<animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="0.9s" dur="0.4s" fill="freeze"/>
<text x="20" y="148" class="label">stack:</text>
<text x="140" y="148" class="value">JavaScript · TypeScript · Python · Go</text>
</g>

<g id="r4" opacity="0">
<animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.4s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="1.1s" dur="0.4s" fill="freeze"/>
<text x="20" y="174" class="label">now:</text>
<text x="140" y="174" class="value">Building MindSet X — AI triage</text>
</g>

<g id="r5" opacity="0">
<animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.4s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="1.3s" dur="0.4s" fill="freeze"/>
<text x="20" y="200" class="label">community:</text>
<text x="140" y="200" class="value">Lead @ GeeksforGeeks</text>
</g>

<g id="r6" opacity="0">
<animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.4s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="1.5s" dur="0.4s" fill="freeze"/>
<text x="20" y="226" class="label">founder:</text>
<text x="140" y="226" class="value">UI Ninj</text>
</g>

<!-- Blinking cursor -->
<rect x="20" y="248" width="8" height="14" fill="#4ecdc4">
<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>
</svg>